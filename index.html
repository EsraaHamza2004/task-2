<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Student Results System</title>
</head>
<body>

    <h2>Student Results System</h2>
    

    <script>
      
        class Student {
            constructor(id, name, grades, attendance) {
                this.id = id;
                this.name = name;
                this.grades = grades;
                this.attendance = attendance;
            }

           
            calculateAverage() {
                let total = this.grades.reduce(
                    (sum, grade) => sum + grade, 0
                );

                return total / this.grades.length;
            }

            getGrade(average) {
                if (average >= 90) {
                    return "A";
                } else if (average >= 80) {
                    return "B";
                } else if (average >= 70) {
                    return "C";
                } else if (average >= 60) {
                    return "D";
                } else if (average >= 50) {
                    return "E";
                } else {
                    return "F";
                }
            }

            getResult() {
                let average = this.calculateAverage();

                if (average >= 50 && this.attendance >= 75) {
                    return "ناجح";
                } else {
                    return "يحتاج مراجعة";
                }
            }
        }

        const studentsList = [
            new Student(101, "Esraa", [90, 85, 95], 95),
            new Student(102, "Ibrahim", [70, 75, 80],90),
            new Student(103, "Ali", [75, 70, 0], 85),
            new Student(104, "Sara", [48, 42, 45], 90)
        ];

        const strugglingStudents = studentsList.filter(student => {
            let average = student.calculateAverage();
            return average >= 40 && average <= 49;
        });

        const graceStudents = strugglingStudents.map(student => {
            return {
                id: student.id,
                name: student.name,
                oldAverage: student.calculateAverage(),
                newAverage: student.calculateAverage() + 5
            };
        });

        const totalNewAverages = graceStudents.reduce(
            (sum, student) => sum + student.newAverage, 0
        );

        let graceAverage = 0;

        if (graceStudents.length > 0) {
            graceAverage = totalNewAverages / graceStudents.length;
        }

        console.log("===== Students Report =====");

        studentsList.forEach(student => {
            const average = student.calculateAverage();

            console.log("ID:", student.id);
            console.log("Name:", student.name);
            console.log("Average:", average);
            console.log("Grade:", student.getGrade(average));
            console.log("Result:", student.getResult());
            console.log("-------------------------");
        });

        console.log("===== Grace Students =====");
        console.log(graceStudents);

        // 12. Print Average After Grace Marks
        console.log(
            "Average After Grace Marks:",
            graceAverage
        );
    </script>

</body>
</html>
